# Met à jour la méta du moment (soloQ OP.GG + drafts pro Leaguepedia) et la commit : Vercel redéploie ensuite tout seul.
# Planifiée, elle tourne sur la branche par défaut (main → production). « Run workflow » permet de la lancer sur dev (préprod).
name: Méta du moment

on:
  schedule:
    # Lundi et jeudi à 6 h UTC : les patchs sortent le mercredi, une semaine sur deux.
    - cron: '0 6 * * 1,4'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      # Le script n'utilise que des modules intégrés à Node : pas besoin de npm install.
      - run: node scripts/update-meta.js
      - name: Commit si la méta a changé
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/data/meta.json
          git diff --cached --quiet || (git commit -m 'chore: méta du moment' && git push)
